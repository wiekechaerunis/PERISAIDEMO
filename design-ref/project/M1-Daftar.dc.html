<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mobile · daftar insiden</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/perisailime/tokens.css">
<link rel="stylesheet" href="ds/perisailime/components/bundle.css">
<link rel="stylesheet" href="lk.css">
<link rel="stylesheet" href="ins.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--ink)}</style>
</helmet>
<div class="in-m" style="height: 900px">
<div class="top"><button type="button" class="ib44" aria-label="Buka menu"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="ttl">Insiden</span><button type="button" class="ib44" aria-label="Cari"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg></button><button type="button" class="ib44" aria-label="Notifikasi"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button></div><div class="body" style="padding-bottom: 96px"><div class="p-qf" role="radiogroup" aria-label="Insiden dan kerawanan" style="display: flex; width: 100%; box-sizing: border-box; flex: none"><button type="button" role="radio" aria-checked="true" style="flex: 1; justify-content: center; height: 40px">Insiden<span class="c">12</span></button><a href="MK1-DaftarKerawanan.dc.html" role="radio" aria-checked="false" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; flex: 1; justify-content: center; padding: 0 12px; border-radius: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-subtle); text-decoration: none; white-space: nowrap">Kerawanan<span class="c">8</span></a></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><button type="button" class="p-chip" aria-pressed="{{fActive}}" onClick="{{openSheet}}" style="min-height: 44px"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="M3 6h18M7 12h10M10 18h4"/></svg>{{fLabel}}</button><span style="font-size: 12px; color: var(--ink-muted)">{{countText}}</span></div><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><a href="M8-Detail.dc.html" class="card" style="text-decoration: none; color: inherit"><div style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; line-height: 20px">{{r.title}}</b><span class="p-mono" style="font-size: 12px; color: var(--ink-muted)">{{r.no}}</span></div><div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="p-tag {{r.sevCls}}"><span class="dot"></span>{{r.sev}}</span><span class="p-tag {{r.stCls}}">{{r.st}}</span></div><span style="font-size: 12px; color: var(--ink-muted)">{{r.meta}}</span></a></sc-for><div style="display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted)"><button type="button" class="lk-alink" style="border: 0; background: none; padding: 0; min-height: 44px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Muat lebih banyak</button></div></div><a href="M2a-Temuan.dc.html" class="{{fabCls}}" aria-label="Buat laporan"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Buat laporan</span></a><sc-if value="{{sheet}}" hint-placeholder-val="{{false}}"><div class="scrim" onClick="{{closeSheet}}"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="f-t"><div class="grab" aria-hidden="true"></div><div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px"><b id="f-t" style="font-size: 17px; line-height: 24px">Filter</b><button type="button" class="ib44" aria-label="Tutup" onClick="{{closeSheet}}"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="sb" style="gap: 16px"><div class="p-field"><span class="p-lbl" style="color: var(--ink)">Status</span><div class="in-chips" style="flex-wrap: wrap"><sc-for list="{{stOpts}}" as="o" hint-placeholder-count="3"><button type="button" class="p-chip" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 44px">{{o.label}}</button></sc-for></div></div><div class="p-field"><span class="p-lbl" style="color: var(--ink)">Keparahan</span><div class="in-chips" style="flex-wrap: wrap"><sc-for list="{{svOpts}}" as="o" hint-placeholder-count="3"><button type="button" class="p-chip" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 44px">{{o.label}}</button></sc-for></div></div><div class="p-field"><span class="p-lbl" style="color: var(--ink)">Kategori</span><div class="in-chips" style="flex-wrap: wrap"><sc-for list="{{ktOpts}}" as="o" hint-placeholder-count="6"><button type="button" class="p-chip" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 44px">{{o.label}}</button></sc-for></div></div><div class="p-field"><span class="p-lbl" style="color: var(--ink)">Periode kejadian</span><span class="p-input"><span class="" style="flex: 1">30 hari terakhir</span><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="m6 9 6 6 6-6"/></svg></span></div></div><div class="sf" style="flex-direction: row"><button type="button" class="p-btn p-btn-secondary" onClick="{{reset}}" style="flex: 1; min-height: 44px; justify-content: center">Atur ulang</button><button type="button" class="p-btn p-btn-primary" onClick="{{apply}}" style="flex: 2; min-height: 44px; justify-content: center">{{applyLabel}}</button></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scroll": {"editor": "enum", "options": ["di atas", "sedang menggulir"], "default": "di atas"}, "$preview": {"width": 390, "height": 900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sheet: false, st: 'all', sv: 'all', dst: 'all', dsv: 'all', dkt: 'all' }; }
  renderVals() {
    const all = [
      { title: 'Pencurian kabel listrik sumur ADR-07', no: 'INS-SEN-2026-0007', sev: 'Tinggi', k: 'hi', sevCls: 's-high', st: 'Review internal', stCls: 't-info', meta: 'Sumur ADR-07 · 28 Okt, 01:00', open: true },
      { title: 'Penghadangan truk logistik oleh warga', no: 'INS-SEN-2026-0005', sev: 'Kritis', k: 'cr', sevCls: 's-crit', st: 'Dalam penanganan', stCls: 't-info', meta: 'SP Batu Ampar · 25 Okt, 07:40', open: true },
      { title: 'Perusakan pagar perimeter terminal', no: 'INS-SEN-2026-0006', sev: 'Sedang', k: 'me', sevCls: 's-med', st: 'Perlu perbaikan', stCls: 't-caution', meta: 'Terminal Arunika · 26 Okt, 22:15', open: true },
      { title: 'Pencurian solar di tangki T-02', no: 'INS-SEN-2026-0004', sev: 'Sedang', k: 'me', sevCls: 's-med', st: 'Ditutup', stCls: 't-ok', meta: 'Terminal Arunika · 19 Okt, 03:30', open: false }
    ];
    const s = this.state;
    const match = (st, sv) => all.filter((r) => (st === 'all' || (st === 'open' ? r.open : !r.open)) && (sv === 'all' || r.k === sv));
    const rows = match(s.st, s.sv);
    const n = (s.st !== 'all' ? 1 : 0) + (s.sv !== 'all' ? 1 : 0);
    const mk = (defs, key) => defs.map(([k, l]) => ({ label: l, on: s[key] === k ? 'true' : 'false', pick: () => this.setState({ [key]: k }) }));
    return {
      rows, countText: rows.length + ' dari 12',
      fLabel: n ? 'Filter · ' + n : 'Filter', fActive: n ? 'true' : 'false',
      sheet: s.sheet, openSheet: () => this.setState({ sheet: true, dst: s.st, dsv: s.sv }),
      closeSheet: () => this.setState({ sheet: false }),
      stOpts: mk([['all', 'Semua'], ['open', 'Masih berjalan'], ['closed', 'Ditutup']], 'dst'),
      ktOpts: mk(['Semua','Pencurian/Perampokan','Pencurian minyak','Pemerasan','Blokade area','Penyanderaan aset','Penghentian kegiatan/operasi','Unjuk rasa','Sabotase','Perusakan material','Kasus tanah','Ancaman','Penculikan','DTT','Kebakaran','Kecelakaan kerja','Kecelakaan lalu lintas','Serangan fisik','Serangan data','Lainnya'].map((l, i) => [i ? 'k' + i : 'all', l]), 'dkt'),
      svOpts: mk([['all', 'Semua'], ['cr', 'Kritis'], ['hi', 'Tinggi'], ['me', 'Sedang'], ['lo', 'Rendah'], ['vl', 'Sangat rendah']], 'dsv'),
      reset: () => this.setState({ dst: 'all', dsv: 'all' }),
      apply: () => this.setState({ sheet: false, st: s.dst, sv: s.dsv }),
      applyLabel: 'Tampilkan ' + match(s.dst, s.dsv).length + ' insiden',
      fabCls: (this.props.scroll ?? 'di atas') === 'di atas' ? 'p-btn p-btn-primary p-fab' : 'p-btn p-btn-primary p-fab mini'
    };
  }
}
</script>
</body>
</html>
