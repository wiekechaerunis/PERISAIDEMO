<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="ds/perisailime/tokens.css">
<link rel="stylesheet" href="ds/perisailime/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}#nav-utama a.nv,#nav-utama a.nv:hover,#nav-utama a.nv span{text-decoration:none}</style>
</helmet>
<nav class="p-sb wide p-wedge" aria-label="Navigasi utama" id="nav-utama" style="border: 0; border-right: 1px solid var(--border); border-radius: 0; min-height: {{minH}}; width: 240px; flex: none; font-family: var(--font-sans); font-size: 13px; line-height: 18px; color: var(--ink)">
  <div class="p-col" style="gap: 14px; padding: 0 6px 16px 6px"><img src="/_blob/960c940381caf74874a8b19488098b2e" alt="PERISAI" style="width: 176px; height: auto; display: block"><div class="idl" aria-hidden="true"><span></span><span></span></div></div>
  <div class="sb-search" style="padding: 0 6px 10px 6px"><span class="p-input" role="button" tabindex="0" aria-label="Cari (⌘K)"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--ink-muted)"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg><span class="ph" style="flex: 1">Cari…</span><span class="k">⌘K</span></span></div>
  <span class="p-lbl" style="padding: 0 8px 6px 8px">Menu</span>
  <a href="#" class="{{cls.ikhtisar}}" aria-current="{{c.ikhtisar}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg><span style="flex: 1">Ikhtisar</span></a>
  <a href="#" class="{{cls.tugas}}" aria-current="{{c.tugas}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span style="flex: 1">Tugas saya</span><sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}"><span class="p-count">{{count}}</span></sc-if></a>
  <a href="#" class="{{cls.tindak}}" aria-current="{{c.tindak}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m3 7 2 2 4-4M3 17l2 2 4-4M13 6h8M13 12h8M13 18h8"/></svg><span style="flex: 1">Tindak lanjut</span></a>
  <span class="p-lbl" style="padding: 14px 8px 6px 8px">Security incident</span>
  <a href="Analitik.dc.html" class="{{cls.analitik}}" aria-current="{{c.analitik}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 3v18h18M7 16v-5M12 16V8M17 16v-3"/></svg><span style="flex: 1">Analitik</span></a>
  <a href="Main.dc.html" class="{{cls.insiden}}" aria-current="{{c.insiden}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg><span style="flex: 1">Insiden</span></a>
  <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><span class="p-lbl" style="padding: 14px 8px 6px 8px">Administrasi</span><a href="CFG-Daftar.dc.html" class="{{cls.pengaturan}}" aria-current="{{c.pengaturan}}"><svg class="p-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span style="flex: 1">Konfigurasi Modul</span></a></sc-if>
  <div class="sb-user"><button type="button" class="p-uc" aria-haspopup="menu" aria-label="Menu akun {{user}}"><span class="p-avatar">{{initials}}</span><span class="nm"><b>{{user}}</b><span class="p-cap">{{role}}</span></span><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--ink-muted)"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div class="ft"><span>© 2026 SKK Migas.<br>Hak cipta dilindungi. v1.0.0</span></div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["ikhtisar","tugas","tindak","insiden","kerawanan","analitik","pengaturan"],"default":"insiden"},"taskCount":{"editor":"int","default":3},"h":{"editor":"int","default":980},"user":{"editor":"text","default":"Budi Santoso"},"role":{"editor":"text","default":"Pelapor KKKS"},"$preview":{"width":240,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active === 'kerawanan' ? 'insiden' : (this.props.active ?? 'insiden');
    const count = this.props.taskCount ?? 3;
    const ids = ['ikhtisar', 'tugas', 'tindak', 'insiden', 'kerawanan', 'analitik', 'pengaturan'];
    const cls = {}, c = {};
    ids.forEach((id) => { cls[id] = id === active ? 'nv on' : 'nv'; c[id] = id === active ? 'page' : 'false'; });
    const user = this.props.user ?? 'Budi Santoso';
    const initials = user.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    return { cls, c, isAdmin: active === 'pengaturan' || /Admin/.test(this.props.role ?? ''), hasCount: count > 0, count: String(count), minH: (this.props.h ?? 980) + 'px', user, initials, role: this.props.role ?? 'Pelapor KKKS' };
  }
}
</script>
</body>
</html>
