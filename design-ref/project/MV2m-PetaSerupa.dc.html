<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--ink)}
.mpf{position:relative;flex:1;min-height:0}
.mpf .rcv-wm{position:absolute;inset:0;height:auto;border-radius:0;box-shadow:none}
.mpf .wm-ctl{top:12px;right:12px}
.mps{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:8px 16px 20px;display:flex;flex-direction:column;gap:12px}
.mps .grab{width:36px;height:4px;border-radius:2px;background:var(--border-control);align-self:center}
.mps .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mps .chips .p-chip{min-height:36px;white-space:nowrap;flex:none}
.mps .sel{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface-sunken)}
.mps .sel .t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);font-weight:600}
.mps .sel b{font-size:15px;line-height:20px}
</style>
</helmet>
<div class="in-m" style="height: 844px; display: flex; flex-direction: column">
<div class="top"><a href="MV2-Review.dc.html" class="ib44" aria-label="Kembali ke Review insiden"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><span class="ttl">Insiden serupa · 7</span><span style="width: 44px"></span></div>
<div class="mpf">
<div class="rcv-wm"><svg viewBox="0 0 390 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Peta sebaran 7 insiden serupa di WK Andalas Darat"><g transform="translate(-40,40) scale(1.7)"><rect x="-40" y="-60" width="400" height="420" fill="color-mix(in srgb, var(--status-info-bg) 75%, var(--surface))"/><path d="M-40,-60 L150,-60 L170,0 L210,40 L270,80 L320,140 L360,170 L360,360 L-40,360 Z" fill="var(--surface)" stroke="var(--border-control)"/><path d="M80,360 L125,140 L170,90 L190,30 L170,0" fill="none" stroke="var(--border-control)" stroke-dasharray="5 4"/><text x="214" y="22" style="font-size: 7px; letter-spacing: 2px; fill: var(--status-info-ink); opacity: .7; font-family: var(--font-sans)">SELAT BANGKA</text><polygon points="150,62 236,52 284,96 268,156 196,170 140,124" fill="color-mix(in srgb, var(--action) 30%, transparent)" stroke="var(--action-line)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="60,40 120,30 132,78 80,92 48,70" fill="color-mix(in srgb, var(--chart-series-1) 14%, transparent)" stroke="var(--chart-series-1)" stroke-width="1"/><text x="62" y="62" style="font-size: 7px; font-family: var(--font-mono); fill: var(--status-info-ink)">WK Rimau</text><text x="160" y="164" style="font-size: 7px; font-weight: 700; font-family: var(--font-sans); fill: var(--action-subtle-ink)">WK Andalas Darat</text><sc-for list="{{dots}}" as="d" hint-placeholder-count="7"><g class="{{d.cls}}"><circle cx="{{d.x}}" cy="{{d.y}}" r="8" class="halo"/><circle cx="{{d.x}}" cy="{{d.y}}" r="3.5" class="dot"/></g></sc-for><g><circle cx="214" cy="104" r="6" fill="var(--ink)"/><circle cx="214" cy="104" r="2.2" fill="var(--action)"/></g></g></svg>
<div class="wm-ctl"><button type="button" class="p-ibtn" aria-label="Perbesar peta" style="width: 40px; height: 40px"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" class="p-ibtn" aria-label="Perkecil peta" style="width: 40px; height: 40px"><svg class="p-ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M5 12h14"/></svg></button></div>

<div class="mps">
<span class="grab" aria-hidden="true"></span>
<div class="wm-lg" style="display: flex; gap: 12px; font-size: 12px"><span><i class="me"></i>Insiden ini</span><span><i class="cs"></i>Insiden serupa</span><span><i class="wk"></i>WK Anda</span></div>
<div class="chips" role="group" aria-label="Sorot pola"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" class="p-chip" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div>

<a href="#" class="p-btn p-btn-secondary" style="justify-content: center; min-height: 44px">Lihat daftar 7 insiden serupa</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pat: null }; }
  renderVals() {
    const s = this.state;
    const P = [['night', 'Waktu', 'Malam hari, 22.00–04.00', 5, false], ['remote', 'Lokasi', 'Area sumur terpencil', 6, true], ['panel', 'Sasaran', 'Kabel panel atau pompa', 4, true], ['cut', 'Modus', 'Kabel dipotong', 3, true]];
    const cur = P.find(p => p[0] === s.pat);
    const D = [[172, 78, 'night remote panel cut'], [190, 128, 'night remote'], [238, 72, 'remote panel'], [258, 112, 'night panel cut'], [228, 148, 'night remote'], [160, 112, 'remote cut'], [244, 132, 'night remote panel']];
    return {
      chips: [[null, 'Semua']].concat(P.map(p => [p[0], p[1] + (p[4] ? ' · AI' : '')])).map(([k, l]) => ({ l, on: s.pat === k ? 'true' : 'false', pick: () => this.setState({ pat: k }) })),
      dots: D.map(([x, y, t]) => { const hit = s.pat && t.split(' ').indexOf(s.pat) >= 0; return { x, y, cls: 'pt' + (s.pat ? (hit ? ' hit' : ' dim') : '') }; }),
      selK: cur ? cur[1] : 'Semua insiden serupa',
      selN: cur ? cur[3] + ' dari 7 kasus' : '7 kasus',
      selV: cur ? cur[2] : 'Pencurian/Perampokan · WK Andalas Darat',
      selSrc: cur ? (cur[4] ? 'Disimpulkan AI dari isi laporan' : 'Dari jam kejadian') : '18 bulan terakhir · sudah Ditutup. Pilih pola untuk menyorot titik.'
    };
  }
}
</script>
